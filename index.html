<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1B1F27" />
<title>OneSecai Inventory</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="top-progress" class="top-progress" hidden><div class="top-progress-bar"></div></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-bars" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <div class="brand-text">
          <strong>OneSecai</strong>
          <small>Inventory Control</small>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item" data-view="dashboard">Dashboard</button>
        <div class="nav-group-label">Inventory</div>
        <button class="nav-item" data-view="items">Items</button>
        <button class="nav-item" data-view="models">Models</button>
        <button class="nav-item" data-view="scan">Scan / Lookup</button>
        <div class="nav-group-label">Operations</div>
        <button class="nav-item" data-view="movements">Movements</button>
        <button class="nav-item" data-view="receive">Receive Stock</button>
        <button class="nav-item" data-view="bulk">Bulk Update</button>
        <button class="nav-item" data-view="deliveries">Deliveries</button>
        <button class="nav-item" data-view="installations">Installations</button>
        <div class="nav-group-label">Master Data</div>
        <button class="nav-item" data-view="clients">Clients</button>
        <button class="nav-item" data-view="suppliers">Suppliers</button>
        <div class="nav-group-label">Insight</div>
        <button class="nav-item" data-view="stock-monitor">Stock Monitor</button>
        <button class="nav-item" data-view="reports">Reports</button>
        <div class="nav-group-label">Admin</div>
        <button class="nav-item" data-view="users">Users</button>
        <button class="nav-item" data-view="settings">Settings</button>
        <button class="nav-item" data-view="audit">Audit Log</button>
      </nav>

      <div class="sidebar-footer">
        <div class="who">
          <span id="who-name">—</span>
          <small id="who-role">—</small>
        </div>
        <button id="logout-btn" class="link-btn">Sign out</button>
      </div>
    </aside>

    <div class="mobile-topbar">
      <button id="menu-toggle" aria-label="Open menu">☰</button>
      <span>OneSecai Inventory</span>
    </div>

    <main class="content" id="content">
      <div class="loading-banner" id="loading-banner" hidden>Working…</div>
      <div id="view-root"></div>
    </main>
  </div>

  <nav class="bottom-tabs" id="bottom-tabs">
    <button class="bottom-tab" data-view="dashboard"><span class="bt-icon">⌂</span><span>Home</span></button>
    <button class="bottom-tab" data-view="items"><span class="bt-icon">▤</span><span>Items</span></button>
    <button class="bottom-tab" data-view="scan"><span class="bt-icon">◎</span><span>Scan</span></button>
    <button class="bottom-tab" data-view="bulk"><span class="bt-icon">≡+</span><span>Bulk</span></button>
    <button class="bottom-tab" id="bottom-tab-menu"><span class="bt-icon">☰</span><span>Menu</span></button>
  </nav>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" id="modal">
      <div class="modal-head">
        <h2 id="modal-title">Title</h2>
        <button class="modal-close" id="modal-close" aria-label="Close">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
